name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run engine and domain tests
        run: pytest -q --ignore=tests/test_qa_streamlit_harness.py
      - name: Run headless Streamlit gameplay QA
        run: pytest -q tests/test_qa_streamlit_harness.py --junitxml=qa-results.xml
      - name: Generate deterministic QA scenario report
        if: always()
        run: python scripts/qa_snapshot_report.py --output qa-report.json
      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wod-rpg-qa-report
          path: |
            qa-results.xml
            qa-report.json
          if-no-files-found: warn
